---
version: 2
#id: nobs
name: NOBS
identifier: nobs
description: NOBS (NOBS) is a Private Torrent Tracker for MOVIES / TV
language: es-es
urls:
  - https://nobs.rawsmoke.net/
privacy: private
protocol: torrent
supports:
  - irc
  - rss
# source: UNIT3D
settings:
  - name: rsskey
    type: secret
    required: true
    label: RSS key
    help: "Go to Profile > Settings > RSS Key, and copy your RSS Key"

irc:
  network: Local
  server: irc
  port: 6667
  tls: false
  auth:
    mechanism: NICKSERV
  settings:
    - name: nick
      type: text
      required: false
      label: Nick
      help: Bot nick. Eg. user_bot

    - name: auth.account
      type: text
      required: false
      label: NickServ Account
      help: NickServ account. Make sure to group your user and bot.

    - name: auth.password
      type: secret
      required: false
      label: NickServ Password
      help: NickServ password

  channels:
    - name: "#nobs_announce"
      announcers:
        - tracker_announcer_bot
        - telegramircrr_dev
      parse:
        type: single
        lines:
          - tests:
              - line: "Title: [Release Name S01 1080p AMZN WEB-DL DDP5.1 H.264-NOGROUP] | Category: [Series] | Size: [13.37 GiB] | Uploader: [AnonymousUploader] | Freeleech: [0] | URL: [https://http-https-echo.n39478gv5y.duckdns.org:8443/torrents/18741] | Id: [18741] | TMDBID: [1337] | IMDBID: [11337] | TVDBID: [111337] | Tags: []"
                expect:
                  releaseName: Release Name S01 1080p AMZN WEB-DL DDP5.1 H.264-NOGROUP
                  category: Series
                  torrentSize: 13.37 GiB
                  uploader: AnonymousUploader
                  freeleechPercent: "0"
                  torrentId: "18741"
                  tmdb: 1337
                  imdb: 11337
                  tvdb: 111337
                  tags: ""
              - line: "Title: [Release Name S01 1080p AMZN WEB-DL DDP5.1 H.264-NOGROUP] | Category: [Series] | Size: [13.37 GiB] | Uploader: [AnonymousUploader] | Freeleech: [0] | URL: [https://http-https-echo.n39478gv5y.duckdns.org:8443/torrents/18741] | Id: [18741] | TMDBID: [1337] | IMDBID: [11337] | TVDBID: [111337] | Tags: [double_upload,featured]"
                expect:
                  releaseName: Release Name S01 1080p AMZN WEB-DL DDP5.1 H.264-NOGROUP
                  category: Series
                  torrentSize: 13.37 GiB
                  uploader: AnonymousUploader
                  freeleechPercent: "0"
                  torrentId: "18741"
                  tmdb: 1337
                  imdb: 11337
                  tvdb: 111337
                  tags: "double_upload,featured"
            pattern: 'Title: \[(?P<releaseName>.+?)\] \| Category: \[(?P<category>.+?)\] \| Size: \[(?P<torrentSize>.+?)\] \| Uploader: \[(?P<uploader>.+?)\] \| Freeleech: \[(?P<freeleechPercent>\d+)\] \| URL: \[\S+\] \| Id: \[(?P<torrentId>\d+)\] \| TMDBID: \[(?P<tmdb>\d*)\] \| IMDBID: \[(?P<imdb>\d*)\] \| TVDBID: \[(?P<tvdb>\d*)\] \| Tags: \[(?P<tags>.*)\]'

        match:
          infourl: "/torrents/{{ .torrentId }}"
          downloadurl: "/torrent/download/{{ .torrentId }}.{{ .rsskey }}"
